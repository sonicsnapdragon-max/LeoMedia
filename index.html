<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory Gate</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0f12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 1;
            opacity: 0.4;
            transition: background-color 1s ease;
        }

        body::before {
            top: 20%;
            left: 15%;
            background-color: #00f2fe;
        }

        body::after {
            bottom: 20%;
            right: 15%;
            background-color: #ff0055;
        }

        body.is-loading::before {
            background-color: #ff0055;
        }
        body.is-loading::after {
            background-color: #00f2fe;
        }

        .card {
            position: relative;
            z-index: 10;
            background: rgba(20, 24, 33, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .icon-container {
            margin-bottom: 20px;
            color: #00f2fe;
            font-size: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .verify-btn {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 54px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #0052d4 0%, #4364f7 50%, #6fb1fc 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(67, 100, 247, 0.4);
            letter-spacing: 0.5px;
        }

        .verify-btn:hover:not(.loading) {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #ff0055 0%, #ff5050 100%);
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.4);
        }

        .verify-btn:active:not(.loading) {
            transform: translateY(0);
        }

        .verify-btn.loading {
            background: #1e293b;
            box-shadow: none;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #00f2fe;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-container">🛡️</div>
        <h1>Security Check</h1>
        <p>To access the directory safely and bypass automated platform crawling bugs, please verify your session below.</p>
        
        <button id="verifyBtn" class="verify-btn" onclick="secureRedirect()">
            <span id="btnText">Verify & Proceed</span>
            <div id="btnSpinner" class="spinner"></div>
        </button>
    </div>

    <script>
    function secureRedirect() {
        var btn = document.getElementById("verifyBtn");
        var text = document.getElementById("btnText");
        var spinner = document.getElementById("btnSpinner");

        if (btn.classList.contains("loading")) return;

        btn.classList.add("loading");
        document.body.classList.add("is-loading"); 
        text.style.display = "none";
        spinner.style.display = "block";

        // Double-encoded secure string pointing to linktr.ee/LukeLeo
        var primaryPayload = "YUhSMGNITTZMeTlzYVc1cmRHSTVaV1V2VEhWclpVbHViVTh9"; 
        
        // Clean dynamic decode chain
        var resolvedTarget = atob(atob(primaryPayload));

        setTimeout(function() {
            window.location.href = resolvedTarget;
        }, 1500); 
    }
</script>

</body>
</html>
